name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile
          # Fedora bootc: dnf pins are not applicable; the cleanup line uses bash brace expansion, and separate RUN steps keep the layers readable
          ignore: DL3041,DL3033,DL3059,SC3009
